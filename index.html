function startReferenceLoginAnimation(){
  if(window.__loginRefCleanup)window.__loginRefCleanup();
  const v=document.getElementById('loginReferenceVideo'),c=document.getElementById('loginReferenceCanvas'),panel=document.querySelector('.login-panel');
  if(!v||!c||!panel)return;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  let raf=0,started=false,revealed=false;
  const draw=()=>{
    if(v.readyState>=2){
      const w=720,h=455;
      if(c.width!==w||c.height!==h){c.width=w;c.height=h}
      ctx.clearRect(0,0,w,h);
      const vw=v.videoWidth||1440,vh=v.videoHeight||909;
      // Keep the entire person + suitcase scene; the supplied source has no login UI in it.
      const cropY=Math.max(0,(vh-h*vw/w)*0.5);
      const srcH=Math.min(vh,h*vw/w);
      ctx.drawImage(v,0,cropY,vw,srcH,0,0,w,h);
      const img=ctx.getImageData(0,0,w,h),d=img.data;
      for(let i=0;i<d.length;i+=4){
        const rr=d[i],gg=d[i+1],bb=d[i+2];
        const blue=bb>155&&gg>65&&bb>rr*1.28&&bb>gg*1.08;
        if(blue)d[i+3]=0;
        else if(bb>130&&bb>rr*1.10)d[i+3]=Math.max(0,d[i+3]-Math.min(120,(bb-130)*2));
      }
      ctx.putImageData(img,0,0);
    }
    raf=requestAnimationFrame(draw);
  };
  const reveal=()=>{
    if(revealed)return; revealed=true; panel.classList.add('login-revealed');
    const label=document.querySelector('.scene-title p'); if(label)label.textContent='Secure sign-in is ready.';
  };
  const start=()=>{
    if(started)return; started=true; v.loop=false; v.muted=true; v.currentTime=0;
    const p=v.play(); if(p&&p.catch)p.catch(()=>{});
    // Let the single supplied animation complete before revealing the real form.
    const duration=(v.duration&&isFinite(v.duration))?v.duration:10;
    setTimeout(reveal,Math.max(4500,Math.min(8200,duration*1000-900)));
  };
  if(v.readyState>=2)start(); else v.addEventListener('loadeddata',start,{once:true});
  v.addEventListener('ended',reveal,{once:true});
  draw();
  window.__loginRefCleanup=()=>{cancelAnimationFrame(raf);try{v.pause()}catch(e){}};
}

async function showResult(dataOverride=null){const n=sessionStorage.getItem('student_reg')||'',c=sessionStorage.getItem('student_code')||'';let data=dataOverride;if(!data){const res=await sb.rpc('get_verified_student_result',{p_registration_number:n,p_result_code:c});if(res.error||!res.data){toast('The verified result could not be loaded.');return}data=res.data}const st=data.student||{},school=data.school||{},subjects=data.subjects||[],traits=data.traits||[];const pct=subjects.length?subjects.reduce((a,x)=>a+Number(x.total||0),0)/Math.max(subjects.reduce((a,x)=>a+Number(x.max_total||0),0),1)*100:0;const grade=pct>=70?'A':pct>=60?'B':pct>=50?'C':pct>=45?'D':pct>=40?'E':'F';const traitOrder=['Punctuality','Attendance at Class','Reliability','Neatness','Politeness','Honesty','Relationship with Staff','Relationship with Other Student(s)','Self Control','Some of Co-operation','Sense of Responsibility','Attentiveness','Initiative','Perseverance'];const traitMap=new Map(traits.map(t=>[t.name,t.rating]));A.innerHTML=`<section class="result"><div style="display:flex;justify-content:space-between"><button class="back" onclick="studentPortal()">← Student Portal</button><button class="outline" onclick="window.print()">Print</button></div><article class="sheet"><div class="sheethead"><img class="brand-logo" src="${school.logo_url||'assets/eresults-logo-final-transparent.png'}" alt="${esc(school.name||'School logo')}"><div><h2>${esc(school.name||'eResults School')}</h2><p>${esc(school.motto||'')} • Senior Student Report Sheet</p><small>${[school.address,school.phone].filter(Boolean).map(esc).join(' • ')}</small></div></div><div class="meta"><span><b>Student</b>${esc(st.name||'')}</span><span><b>Admission No.</b>${esc(st.registration_number||n)}</span><span><b>Class</b>${esc(st.class||st.grade_level||'')}</span><span><b>Grade</b>${grade}</span><span><b>Next Term Begins</b>${data.next_term_begins?new Date(data.next_term_begins+'T00:00:00').toLocaleDateString(): '—'}</span></div><table class="table"><thead><tr><th>Subject</th><th>CA %</th><th>Exam %</th><th>Total</th><th>Grade</th><th>Remarks</th></tr></thead><tbody>${subjects.map(x=>{const t=Number(x.total||0),m=Number(x.max_total||100),p=m?t/m*100:0,g=p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F';return `<tr><td>${esc(x.name)}</td><td>${Number(x.ca||0)}</td><td>${Number(x.exam||0)}</td><td>${t}</td><td>${g}</td><td>${g==='A'?'Excellent progress':g==='B'?'Very good progress':g==='C'?'Good progress':g==='D'?'Fair progress':g==='E'?'Basic progress':'Needs improvement'}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No subject results have been published for this student yet.</td></tr>'}</tbody></table><div class="traits"><h3>General Traits</h3><div class="traitgrid">${traitOrder.map(t=>`<div><span>${t}</span><b>${traitMap.has(t)?traitMap.get(t):'—'}</b></div>`).join('')}</div><p class="muted" style="margin-top:12px">5 = Excellent degree • 4 = High level • 3 = Acceptable • 2 = Minimal regard • 1 = No regard</p></div><div style="margin-top:20px;padding:14px;background:#f8fafc"><b>Teacher’s Comment</b><p class="muted">${esc(data.teacher_comment||'No teacher comment recorded.')}</p><b>Principal’s Comment</b><p class="muted">${esc(data.principal_comment||'No principal comment recorded.')}</p></div><div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:45px;font-size:11px"><div>${school.signature_url?`<img src="${school.signature_url}" alt="Principal signature" style="max-height:70px;max-width:180px;display:block">`:''}${school.stamp_url?`<img src="${school.stamp_url}" alt="School stamp" style="max-height:90px;max-width:120px;display:block">`:''}<span>Principal’s Signature / Stamp</span></div><span>Date: __________________</span></div></article></section>`}

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function saveSchoolSettings(e){
  e.preventDefault(); const btn=e.currentTarget.querySelector('button[type=submit]'); setFormBusy(e.currentTarget,btn,'Saving settings…');
  const{data,error}=await sb.from('schools').update({name:setName.value.trim(),email:setEmail.value.trim()||null,phone:setPhone.value.trim()||null,address:setAddress.value.trim()||null,motto:setMotto.value.trim()||null}).eq('id',currentUser.school_id).select().single();
  if(error){toast(error.message);setFormBusy(e.currentTarget,btn,'Save School Information',false);return}

async function uploadSchoolBranding(){
  const files=[['logoFile','logo_url'],['signatureFile','signature_url'],['stampFile','stamp_url']];
  const updates={}; let changed=false;
  for(const[id,column] of files){const f=document.getElementById(id)?.files?.[0];if(!f)continue;if(!f.type.startsWith('image/')){toast('Only image files are allowed.');return}if(f.size>3*1024*1024){toast('Each branding image must be 3 MB or smaller.');return}
    const ext=(f.name.split('.').pop()||'png').toLowerCase();const path=`${currentUser.school_id}/${column}-${Date.now()}.${ext}`;
    const{error}=await sb.storage.from('school-branding').upload(path,f,{upsert:true,contentType:f.type});if(error){toast(error.message);return}
    const{data}=sb.storage.from('school-branding').getPublicUrl(path);updates[column]=data.publicUrl;changed=true;
  }
  if(!changed){toast('Choose at least one branding image.');return}
  const{data,error}=await sb.from('schools').update(updates).eq('id',currentUser.school_id).select().single();if(error){toast(error.message);return}
  schoolBranding=data;toast('School branding saved.');schoolSettings();
}

async function requestSubscription(plan,contactMethod){
  try{
    const {data:requestId,error}=await sb.rpc('create_subscription_request',{p_plan_id:plan.id,p_contact_method:contactMethod});
    if(error) throw error;
    const requestedAt=new Date();
    const price=Number(plan.price||0), period=String(plan.billing_period||'').toLowerCase();
    const duration=period==='annual'?'12 months':period==='monthly'?'1 month':period==='trial'?'Trial period':(plan.billing_period||'');
    const currentPlan=window.__currentSubscription?.subscription_plans?.name||'No active plan';
    const expires=window.__currentSubscription?.expires_at?new Date(window.__currentSubscription.expires_at).toLocaleString('en-NG'):'Not currently active';
    const schoolName=schoolBranding?.name||'Not provided', schoolEmail=schoolBranding?.email||'Not provided', schoolPhone=schoolBranding?.phone||'Not provided', schoolAddress=schoolBranding?.address||'Not provided';
    const managementName=currentUser?.full_name||'Not provided', username=currentUser?.username||'Not provided';
    const message=[
      'eRESULTS | SCHOOL MANAGEMENT PLATFORM','━━━━━━━━━━━━━━━━━━━━','SUBSCRIPTION REQUEST','',
      'SCHOOL DETAILS','• School Name: '+schoolName,'• Email: '+schoolEmail,'• Phone: '+schoolPhone,'• Address: '+schoolAddress,'',
      'MANAGEMENT DETAILS','• Full Name: '+managementName,'• Username: '+username,'• Role: '+(currentUser?.role||'management'),' ',
      'REQUESTED PLAN','• Plan: '+plan.name,'• Amount: ₦'+price.toLocaleString('en-NG'),'• Billing: '+duration,'• Billing Period: '+(plan.billing_period||'—'),' ',
      'CURRENT SUBSCRIPTION','• Current Plan: '+currentPlan,'• Current Expiry: '+expires,'',
      'REQUEST INFORMATION','• Request ID: '+requestId,'• Date: '+requestedAt.toLocaleDateString('en-NG'),'• Time: '+requestedAt.toLocaleTimeString('en-NG'),'• Requested At: '+requestedAt.toLocaleString('en-NG'),'• Contact Method: '+contactMethod.toUpperCase(),'','eResults Subscription Desk','Please review the details above and confirm activation.','━━━━━━━━━━━━━━━━━━━━'
    ].join('\n');
    const subject='eResults | '+plan.name+' Subscription Request | '+schoolName;
    const encodedSubject=encodeURIComponent(subject), encodedBody=encodeURIComponent(message), encodedTo=encodeURIComponent(PLATFORM_EMAIL);
    if(contactMethod==='whatsapp'){
      await shareBrandedSubscription(plan.id);
    }else{
      // Android: target Gmail first. If the Gmail app is unavailable, use the normal mailto handler.
      const gmailIntent='intent://compose?to='+encodedTo+'&subject='+encodedSubject+'&body='+encodedBody+'#Intent;scheme=mailto;package=com.google.android.gm;end';
      let switched=false;
      const onBlur=()=>{switched=true;window.removeEventListener('blur',onBlur)};
      window.addEventListener('blur',onBlur);
      window.location.href=gmailIntent;
      setTimeout(()=>{window.removeEventListener('blur',onBlur);if(!switched)window.location.href='mailto:'+PLATFORM_EMAIL+'?subject='+encodedSubject+'&body='+encodedBody},1200);
    }
    toast('Request recorded successfully. Opening '+(contactMethod==='whatsapp'?'the branded WhatsApp share screen.':'Gmail compose.'));
    const card=document.getElementById('requestStatus-'+plan.id);if(card)card.innerHTML='<div class="request-note request-sent"><b>Request submitted successfully.</b><br>Request ID: '+esc(requestId)+' · '+esc(requestedAt.toLocaleString('en-NG'))+'</div>';
  }catch(err){toast('Could not create subscription request: '+(err?.message||'Unknown error'))}
}

async function subscriptionPlans(){
  await ensureSupabase();
  const{data:plans,error}=await sb.from('subscription_plans').select('id,name,description,price,billing_period,features').eq('active',true).order('price');
  if(error){toast(error.message);return}
  const{data:sub}=await sb.from('school_subscriptions').select('status,started_at,expires_at,plan_id,subscription_plans(name)').eq('school_id',currentUser.school_id).order('created_at',{ascending:false}).limit(1).maybeSingle();
  const{data:pending,error:pe}=await sb.rpc('school_pending_subscription_request');
  if(pe){toast(pe.message);return}
  const pendingRequest=pending?.[0]||null;
  window.__currentSubscription=sub||null; window.__subscriptionPlans=plans||[];
  const exp=sub?.expires_at?new Date(sub.expires_at):null;
  const days=exp?Math.ceil((exp-new Date())/86400000):null;
  const reminder=days!==null&&days>=0&&days<=7?`<div class="panel" style="background:#fff8df;border:1px solid #f1d27a"><b>Subscription reminder:</b> Your ${esc(sub?.subscription_plans?.name||'subscription')} ends in ${days} day${days===1?'':'s'}. Please submit a renewal request before it expires.</div>`:'';
  const pendingBanner=pendingRequest?`<div class="panel" style="background:#fff8df;border:1px solid #e7c45f"><div class="ey">REQUEST PENDING</div><h3 style="margin:5px 0">Your ${esc(pendingRequest.plan_name)} upgrade request is pending</h3><p class="muted">Request ID: ${esc(pendingRequest.request_id)} · Submitted ${new Date(pendingRequest.created_at).toLocaleString('en-NG')}</p><b>Please wait for the platform owner to accept or reject this request.</b></div>`:'';
  const cards=(plans||[]).map(p=>{
    const price=Number(p.price||0),period=String(p.billing_period||'').toLowerCase();
    const duration=period==='annual'?'12 months':period==='monthly'?'1 month':period==='trial'?'Trial':(p.billing_period||'Plan');
    const equivalent=period==='monthly'?'3-month term: ₦30,000':period==='annual'?'Average monthly cost: ₦'+Math.round(price/12).toLocaleString('en-NG'):'';
    const locked=!!pendingRequest;
    return `<div class="plan-card ${period==='annual'?'plan-featured':''}"><div class="ey">${esc(p.billing_period||'PLAN')}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||'')}</p><div class="plan-price">${price>0?'₦'+price.toLocaleString('en-NG'):'Free'}</div><div class="plan-period">${esc(duration)}</div>${equivalent?`<div class="plan-equivalent">${esc(equivalent)}</div>`:''}<ul>${(Array.isArray(p.features)?p.features:[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul><div class="plan-contact-actions">${locked?`<button class="outline" disabled>Request Pending</button>`:`<a class="outline" href="#" onclick="requestSubscriptionById('${esc(p.id)}','whatsapp');return false">WhatsApp Request</a><a class="outline" href="#" onclick="requestSubscriptionById('${esc(p.id)}','gmail');return false">Gmail Request</a>`}</div><div id="requestStatus-${esc(p.id)}"></div></div>`
  }).join('');
  shell('Subscription Plans',`${pendingBanner}${reminder}<div class="panel"><div class="ey">SCHOOL SUBSCRIPTION</div><h3>${sub?.subscription_plans?.name?`Current plan: ${esc(sub.subscription_plans.name)}`:'No active plan recorded'}</h3><p class="muted">Select a plan and send a professional subscription request. Only one upgrade request can remain pending at a time.</p><div class="subscription-current"><div class="mini"><small>Current status</small><b>${esc(sub?.status||'Not active')}</b></div><div class="mini"><small>Started</small><b>${sub?.started_at?new Date(sub.started_at).toLocaleDateString('en-NG'):'—'}</b></div><div class="mini"><small>Expires</small><b>${exp?exp.toLocaleDateString('en-NG'):'—'}</b></div><div class="mini"><small>Request status</small><b>${pendingRequest?'Pending':'No pending request'}</b></div></div><div class="request-note"><b>Pricing:</b> Monthly ₦10,000 · 3-month equivalent ₦30,000 · Yearly ₦80,000.</div></div><div class="plans-grid">${cards||'<div class="panel">No subscription plans are currently available.</div>'}</div>`)
}

async function loadTeachers(){const{data}=await sb.from('profiles').select('full_name,username').eq('school_id',currentUser.school_id).eq('role','teacher').order('full_name');document.getElementById('teacherList').innerHTML=(data||[]).map(x=>`<div style="padding:9px 0;border-bottom:1px solid #edf1f6"><b>${x.full_name}</b><small style="display:block;color:var(--m)">${x.username}</small></div>`).join('')||'No teachers yet.'}
async function resultEntry(){const{data:as,error:ae}=await sb.from('teacher_assignments').select('class_id').eq('teacher_id',currentUser.id).eq('school_id',currentUser.school_id).single();if(ae){toast('No class assignment found.');return}const{data:students}=await sb.from('students').select('id,full_name,registration_number').eq('school_id',currentUser.school_id).eq('class_id',as.class_id).order('full_name');const{data:links}=await sb.from('class_subjects').select('subject_id').eq('class_id',as.class_id);const ids=(links||[]).map(x=>x.subject_id);const{data:subjects}=ids.length?await sb.from('subjects').select('id,name,code').in('id',ids).order('name'):{data:[]};const{data:components}=await sb.from('assessment_components').select('id,name,max_score,sort_order').eq('school_id',currentUser.school_id).order('sort_order');const{data:terms}=await sb.from('terms').select('id').eq('is_current',true).limit(1);window._currentTerm=terms?.[0]?.id||null;shell('Assessment Entry',`<div class="panel"><h3>Enter academic assessment</h3><p class="muted">Assigned class only. Scores are checked against each configured maximum.</p><div class="form"><label class="field"><span>Student</span><select id="reStudent" style="padding:12px;border:1px solid var(--l);border-radius:10px">${(students||[]).map(x=>`<option value="${x.id}">${x.full_name} — ${x.registration_number}</option>`).join('')}</select></label><label class="field"><span>Subject</span><select id="reSubject" style="padding:12px;border:1px solid var(--l);border-radius:10px">${(subjects||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></label><div id="scoreFields"></div><h3>General Traits (5–1)</h3><div class="traitgrid">${['Punctuality','Attendance at Class','Reliability','Neatness','Politeness','Honesty','Relationship with Staff','Relationship with Other Student(s)','Self Control','Some of Co-operation','Sense of Responsibility','Attentiveness','Initiative','Perseverance'].map(t=>`<label class="field"><span>${t}</span><select class="traitInput" data-trait="${t}"><option value="">—</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></label>`).join('')}</div><label class="field"><span>Teacher Comment</span><textarea id="teacherComment" placeholder="Write a teacher comment…"></textarea></label><button class="primary full" onclick="saveScores()">Save Assessment & Traits</button></div></div>`);window._components=components||[];document.getElementById('scoreFields').innerHTML=window._components.map(c=>`<label class="field"><span>${c.name} (max ${c.max_score})</span><input class="scoreInput" data-id="${c.id}" data-max="${c.max_score}" type="number" min="0" max="${c.max_score}" step="0.01" value="0"></label>`).join('')}
async function saveScores(){const student=document.getElementById('reStudent').value,subject=document.getElementById('reSubject').value,term=window._currentTerm||null;for(const input of document.querySelectorAll('.scoreInput')){const score=Number(input.value||0),max=Number(input.dataset.max);if(score<0||score>max){toast('A score cannot exceed its component maximum.');return}const{error}=await sb.from('result_entries').upsert({school_id:currentUser.school_id,student_id:student,subject_id:subject,component_id:input.dataset.id,score,teacher_id:currentUser.id,term_id:term},{onConflict:'student_id,subject_id,component_id,term_id'});if(error){toast(error.message);return}}for(const input of document.querySelectorAll('.traitInput')){if(!input.value)continue;const{error}=await sb.from('general_traits').upsert({school_id:currentUser.school_id,student_id:student,trait_name:input.dataset.trait,rating:Number(input.value),term_id:term},{onConflict:'student_id,trait_name,term_id'});if(error){toast(error.message);return}}const comment=(document.getElementById('teacherComment')?.value||'').trim();if(comment){const{error}=await sb.from('result_comments').upsert({school_id:currentUser.school_id,student_id:student,teacher_id:currentUser.id,comment_type:'teacher',comment,term_id:term},{onConflict:'student_id,comment_type,term_id'});if(error){toast(error.message);return}}toast('Assessment scores, traits and teacher comment saved.')}
function setFormBusy(form,button,label,reset=true){if(!button)return;if(reset===false){button.disabled=false;button.classList.remove('action-loading');button.textContent=label;return}button.disabled=true;button.classList.add('action-loading');button.textContent=label}

function enhancePasswordInputs(){document.querySelectorAll('input[type="password"]').forEach(input=>{if(input.dataset.eyeReady)return;input.dataset.eyeReady='1';const wrap=document.createElement('div');wrap.className='password-wrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const b=document.createElement('button');b.type='button';b.className='password-toggle';b.setAttribute('aria-label','Show password');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';b.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';b.innerHTML=show?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.7 17.7 0 0 1-3.2 3.9M6.2 6.3C3.5 8.1 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.1-.9"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';b.setAttribute('aria-label',show?'Hide password':'Show password')});wrap.appendChild(b)})}
const passwordObserver=new MutationObserver(()=>enhancePasswordInputs());passwordObserver.observe(A,{childList:true,subtree:true});

async function bootApp(){
  A.innerHTML='<section class="app-boot"><div class="app-boot-card"><img src="assets/eresults-real-logo-transparent.png" alt="eResults"><div class="boot-spinner"></div><p>Checking your session…</p></div></section>';
  try{
    await ensureSupabase();
    sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setTimeout(passwordRecoveryPage,0)});
    // Recovery links must always open the password form before normal session restoration.
    if(location.hash.includes('type=recovery')||location.hash.includes('access_token=')){
      passwordRecoveryPage();
      return;
    }
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    if(data?.session){
      await loadUser(data.session.user.id);
      // Authenticated refresh always returns to the signed-in portal, never the public homepage.
      return;
    }
    restorePublicRoute();
  }catch(err){
    console.warn('eResults session check failed:',err);
    // Never silently throw the user to the homepage after a refresh/network hiccup.
    A.innerHTML='<section class="app-boot"><div class="app-boot-card"><img src="assets/eresults-real-logo-transparent.png" alt="eResults"><h2>Connection check</h2><p>We could not verify your session right now.</p><button class="primary" onclick="bootApp()">Try Again</button></div></section>';
  }
}
bootApp();</script></body></html>
