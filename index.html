<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>eResults Creator Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#10213f;background:#f4f8fd;--b:#0b5ed7;--ink:#10213f;--m:#6d7b90;--l:#e2e9f2;--soft:#edf5ff;--ok:#138a55;--warn:#9a6a00;--bad:#a63d3d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f5f9ff,#eef5fc);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,94vw);margin:auto}.top{background:#fff;border-bottom:1px solid var(--l);padding:14px 0;position:sticky;top:0;z-index:5}.topin{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:105px;height:38px;object-fit:contain}.brand small{display:block;color:var(--m);font-weight:700;font-size:10px}.private{font-size:10px;font-weight:900;letter-spacing:1.2px;color:var(--b);background:var(--soft);padding:7px 10px;border-radius:999px}.card,.panel{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 15px 45px rgba(22,57,98,.06)}.login{width:min(460px,92vw);margin:9vh auto;padding:30px}.login h1{font-size:28px;margin:8px 0}.ey{color:var(--b);font-size:10px;font-weight:900;letter-spacing:1.5px}.muted{color:var(--m);line-height:1.6}.form{display:grid;gap:13px;margin-top:22px}.field{display:grid;gap:6px}.field span{font-size:12px;font-weight:800}.field input,.field textarea,.field select{border:1px solid #d6e0ec;border-radius:10px;padding:12px;outline:none;background:#fff}.primary,.outline{border-radius:10px;padding:11px 15px;font-weight:900}.primary{background:var(--b);color:#fff;border:1px solid var(--b)}.outline{background:#fff;border:1px solid #d5dfeb;color:#36506d}.full{width:100%}.forgot{background:none;border:0;color:var(--b);font-weight:800;text-decoration:underline;text-align:left;padding:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{padding:20px}.stat b{font-size:30px;display:block}.stat small{color:var(--m)}.main{padding:26px 0 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.head h1{margin:4px 0;font-size:32px}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{padding:20px;margin-top:18px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid #edf1f6;text-align:left;font-size:12px;vertical-align:top}.table th{background:#f7faff;color:#53657d}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.active{background:#eafaf2;color:var(--ok)}.expired{background:#fff0f0;color:var(--bad)}.soon{background:#fff6dc;color:var(--warn)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.request{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1f6}.request:last-child{border-bottom:0}.notice{background:#f7faff;border:1px solid #dbeafe;border-radius:12px;padding:12px;margin:8px 0}.notice b,.notice span,.notice small{display:block}.notice span{color:#53657d;margin:5px 0}.notice small{color:#8995a5;font-size:10px}.modal{position:fixed;inset:0;background:#071426aa;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.modal .card{width:min(440px,100%);padding:24px}.error{color:var(--bad);font-size:12px;min-height:18px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{width:min(94vw,100%)}.grid{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:25px}.brand img{width:90px}.panel{padding:15px}.request{grid-template-columns:1fr}.actions button{width:100%}}
</style></head><body><header class="top"><div class="wrap topin"><div class="brand"><img src="../assets/eresults-real-logo-transparent.png" alt="eResults"><div><b>Creator Portal</b><small>Platform Owner</small></div></div><span class="private">PRIVATE ACCESS</span></div></header><main id="app" class="wrap"></main><div id="modal" class="modal"><div class="card"><div class="section-title"><h3 id="modalTitle">Approve subscription</h3><button class="outline" onclick="closeModal()">Close</button></div><form class="form" onsubmit="approveSubscription(event)"><label class="field"><span>Plan</span><select id="approvePlan"></select></label><label class="field"><span>Duration (days)</span><input id="approveDays" type="number" min="1" value="30" required></label><button class="primary full">Approve & Activate</button><div id="modalError" class="error"></div></form></div></div><script>
const SB_URL='https://dxhvkebmkdogeuvuajty.supabase.co',SB_KEY='sb_publishable_RRfVzEIy2PBgMREg9vJTbA_NzurHlrt';const supabase=window.supabase.createClient(SB_URL,SB_KEY);let schools=[],plans=[],requests=[],creatorUser=null,pendingSchool=null,codeBatches=[],publications=[];
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){app.innerHTML=`<section class="card login"><div class="ey">PRIVATE PLATFORM OWNER</div><h1>eResults Creator Portal</h1><p class="muted">This portal is not linked from the public eResults website. Only the authorized Creator account can enter.</p><form class="form" onsubmit="creatorLogin(event)"><label class="field"><span>Creator email</span><input id="email" type="email" value="hasbee1110@gmail.com" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="primary full">Sign in to Creator Portal →</button><button type="button" class="forgot" onclick="creatorReset()">Forgot password?</button><div id="loginError" class="error"></div></form></section>`}
async function creatorLogin(e){e.preventDefault();const er=document.getElementById('loginError');er.textContent='';const email=document.getElementById('email').value.trim().toLowerCase();if(email!=='hasbee1110@gmail.com'){er.textContent='Creator access denied.';return}const{data,error}=await supabase.auth.signInWithPassword({email,password:document.getElementById('password').value});if(error){er.textContent=error.message;return}const{data:stats,error:ce}=await supabase.rpc('creator_stats');if(ce||!stats?.[0]){await supabase.auth.signOut();er.textContent='This account is not authorized for the Creator Portal.';return}creatorUser=data.user;dashboard()}
async function creatorReset(){const{error}=await supabase.auth.resetPasswordForEmail('hasbee1110@gmail.com',{redirectTo:location.origin+'/creator/'});alert(error?error.message:'Reset link sent to hasbee1110@gmail.com. Check the inbox.')}
function logout(){supabase.auth.signOut();creatorUser=null;login()}
async function dashboard(){const[st,sch,pl,req,inv,pubs]=await Promise.all([supabase.rpc('creator_stats'),supabase.rpc('creator_dashboard'),supabase.from('subscription_plans').select('id,name,price,billing_period,description').eq('active',true).order('price'),supabase.rpc('creator_subscription_requests'),supabase.rpc('creator_code_inventory'),supabase.from('result_publications').select('id,school_id,term_id,publication_type,published_at,classes(name),terms(name)').eq('publication_type','master_list').order('published_at',{ascending:false})]);if(st.error||sch.error){await supabase.auth.signOut();login();return}plans=pl.data||[];schools=sch.data||[];requests=req.data||[];codeBatches=inv.data||[];publications=pubs.data||[];const x=st.data?.[0]||{};app.innerHTML=`<main class="main"><div class="head"><div><div class="ey">PRIVATE PLATFORM OWNER</div><h1>Creator Dashboard</h1><p class="muted">Manage schools, subscriptions and platform announcements.</p></div><div class="actions"><button class="outline" onclick="announcementBox()">Send Announcement</button><button class="outline" onclick="dashboard()">Refresh</button><button class="primary" onclick="logout()">Sign out</button></div></div><div class="grid"><div class="card stat"><b>${x.total_schools||0}</b><small>Total Schools</small></div><div class="card stat"><b>${x.total_students||0}</b><small>Total Students</small></div><div class="card stat"><b>${x.active_subscriptions||0}</b><small>Active Subscriptions</small></div><div class="card stat"><b>${x.expiring_soon||0}</b><small>Expiring Within 7 Days</small></div></div><section class="panel"><div class="section-title"><div><h2>Schools</h2><p class="muted">Every school with its current student total.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>School</th><th>Students</th><th>Subscription</th><th>Expires</th><th>Action</th></tr></thead><tbody>${schools.map(s=>{const exp=s.expires_at?new Date(s.expires_at):null;const soon=exp&&exp>new Date()&&exp<=new Date(Date.now()+7*864e5);const st=s.subscription_status==='active'?'active':s.subscription_status==='expired'?'expired':'';return `<tr><td><b>${esc(s.school_name)}</b><small>${esc(s.school_email||'')}</small></td><td><b>${s.student_count||0}</b></td><td><span class="pill ${soon?'soon':st}">${esc(s.plan_name||'Not started')} · ${esc(s.subscription_status||'')}</span></td><td>${exp?exp.toLocaleString():'—'}</td><td><button class="outline" onclick="openApprove('${s.school_id}')">Manage Subscription</button></td></tr>`}).join('')||'<tr><td colspan="5">No schools yet.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="section-title"><div><h2>Result Code Batches</h2><p class="muted">Generate pooled result codes for a specific school and published Master List. ₦200 per code.</p></div></div><form class="form" onsubmit="generateCodeBatch(event)"><div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field"><span>School</span><select id="codeSchool" required onchange="refreshCodePublications()"><option value="">Select school</option>${schools.map(s=>`<option value="${s.school_id}">${esc(s.school_name)}</option>`).join('')}</select></label><label class="field"><span>Published result / examination</span><select id="codePublication" required><option value="">Select school first</option></select></label></div><label class="field"><span>Quantity</span><input id="codeQuantity" type="number" min="1" step="1" placeholder="e.g. 150" required></label><button class="primary" type="submit">Generate Codes →</button><div id="codeBatchError" class="error"></div></form><div class="tablewrap"><table class="table"><thead><tr><th>School</th><th>Quantity</th><th>Available</th><th>Used</th><th>Price/code</th><th>Created</th></tr></thead><tbody>${codeBatches.map(b=>`<tr><td>${esc(b.school_name)}</td><td>${b.quantity}</td><td>${b.available_count}</td><td>${b.used_count}</td><td>₦${Number(b.unit_price||200).toLocaleString()}</td><td>${new Date(b.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="6">No code batches yet.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="section-title"><div><h2>Subscription Requests</h2><p class="muted">Requests sent by School Management through the subscription workflow.</p></div></div>${requests.map(r=>`<div class="request"><div><b>${esc(r.school_name)}</b><span class="muted">${esc(r.plan_name)} · ${esc(r.contact_method)} · ${new Date(r.created_at).toLocaleString()}</span></div><span class="pill ${r.status==='pending'?'soon':r.status==='approved'?'active':'expired'}">${esc(r.status)}</span></div>`).join('')||'<p class="muted">No subscription requests yet.</p>'}</section><section class="panel"><div class="section-title"><div><h2>Platform Announcements</h2><p class="muted">Messages sent from Creator to School Management.</p></div></div><div id="announcements">Loading…</div></section></main>`;loadAnnouncements()}
async function loadAnnouncements(){const{data,error}=await supabase.from('platform_announcements').select('title,body,created_at').eq('active',true).order('created_at',{ascending:false}).limit(20);document.getElementById('announcements').innerHTML=error?'<p class="error">Could not load announcements.</p>':(data||[]).map(a=>`<div class="notice"><b>${esc(a.title)}</b><span>${esc(a.body)}</span><small>${new Date(a.created_at).toLocaleString()}</small></div>`).join('')||'<p class="muted">No announcements yet.</p>'}
function announcementBox(){const title=prompt('Announcement title:');if(!title)return;const body=prompt('Announcement message:');if(!body)return;sendAnnouncement(title,body)}
async function sendAnnouncement(title,body){const{error}=await supabase.rpc('creator_send_announcement',{p_title:title,p_body:body});if(error){alert(error.message);return}alert('Announcement sent to School Management.');dashboard()}
function openApprove(schoolId){pendingSchool=schoolId;document.getElementById('approvePlan').innerHTML=plans.map(p=>`<option value="${p.id}">${esc(p.name)} — ${Number(p.price||0).toLocaleString()}</option>`).join('');document.getElementById('approveDays').value=plans.find(p=>p.billing_period==='annual')?.billing_period==='annual'?365:30;document.getElementById('modalError').textContent='';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');pendingSchool=null}
async function approveSubscription(e){e.preventDefault();const er=document.getElementById('modalError');er.textContent='';if(!pendingSchool)return;const{error}=await supabase.rpc('creator_set_subscription',{p_school_id:pendingSchool,p_plan_id:document.getElementById('approvePlan').value,p_days:Number(document.getElementById('approveDays').value)});if(error){er.textContent=error.message;return}closeModal();alert('Subscription approved and activated.');dashboard()}
function refreshCodePublications(){const sid=document.getElementById('codeSchool')?.value;const sel=document.getElementById('codePublication');if(!sel)return;const rows=publications.filter(p=>p.school_id===sid);sel.innerHTML=rows.map(p=>`<option value="${p.id}">${esc(p.terms?.name||'Result')} · ${new Date(p.published_at).toLocaleDateString()}</option>`).join('')||'<option value="">No published Master List</option>'}
async function generateCodeBatch(e){e.preventDefault();const er=document.getElementById('codeBatchError');er.textContent='';const sid=document.getElementById('codeSchool').value;const pid=document.getElementById('codePublication').value;const qty=Number(document.getElementById('codeQuantity').value);if(!sid||!pid||qty<1){er.textContent='Select a school, published result and valid quantity.';return}const{error}=await supabase.rpc('creator_generate_code_batch',{p_school_id:sid,p_publication_id:pid,p_quantity:qty});if(error){er.textContent=error.message;return}alert(`${qty} result codes generated successfully.`);dashboard()}
async function boot(){const{data}=await supabase.auth.getSession();if(data.session){const email=(data.session.user.email||'').toLowerCase();if(email==='hasbee1110@gmail.com'){const{data:s,error}=await supabase.rpc('creator_stats');if(!error&&s?.[0]){creatorUser=data.session.user;dashboard();return}}await supabase.auth.signOut()}login()}
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){location.hash='';app.innerHTML=`<section class="card login"><div class="ey">SECURE CREATOR RESET</div><h1>Set a new password</h1><form class="form" onsubmit="finishReset(event)"><label class="field"><span>New password</span><input id="np" type="password" minlength="6" required></label><label class="field"><span>Confirm password</span><input id="np2" type="password" minlength="6" required></label><button class="primary full">Update Password</button><div id="loginError" class="error"></div></form></section>`}});
async function finishReset(e){e.preventDefault();const er=document.getElementById('loginError');if(np.value!==np2.value){er.textContent='Passwords do not match.';return}const{error}=await supabase.auth.updateUser({password:np.value});if(error){er.textContent=error.message;return}await supabase.auth.signOut();alert('Password updated. Sign in again.');login()}
boot();
</script></body></html>
