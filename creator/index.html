const SB_URL='https://dxhvkebmkdogeuvuajty.supabase.co';

// Lightweight Supabase REST client. This removes the portal's dependency on a third-party
// JavaScript CDN, which was the cause of the blank Creator page when the CDN did not load.
function createRestSupabase(url,key){
  const AUTH=url+'/auth/v1';
  const API=url+'/rest/v1';
  let session=null;
  const listeners=[];
  try{session=JSON.parse(localStorage.getItem('eresults_creator_session')||'null')}catch{}
  function save(){try{session?localStorage.setItem('eresults_creator_session',JSON.stringify(session)):localStorage.removeItem('eresults_creator_session')}catch{}}
  function emit(event){listeners.slice().forEach(fn=>{try{fn(event,session)}catch{}})}
  async function req(base,path,opts={}){
    const headers=Object.assign({'apikey':key,'Content-Type':'application/json'},opts.headers||{});
    if(session?.access_token) headers.Authorization='Bearer '+session.access_token;
    const r=await fetch(base+path,Object.assign({},opts,{headers}));
    let data=null; try{data=await r.json()}catch{}
    if(!r.ok){const msg=data?.msg||data?.message||data?.error_description||data?.error||('Request failed ('+r.status+')'); return {data:null,error:{message:msg,status:r.status,raw:data}}}
    return {data,error:null};
  }
  const auth={
    async signInWithPassword({email,password}){
      const r=await req(AUTH,'/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
      if(r.error)return r;
      session=r.data; save(); emit('SIGNED_IN'); return {data:{user:r.data.user,session:r.data},error:null};
    },
    async signOut(){session=null;save();emit('SIGNED_OUT');return {error:null}},
    async getSession(){return {data:{session},error:null}},
    async resetPasswordForEmail(email,{redirectTo}={}){
      return req(AUTH,'/recover',{method:'POST',body:JSON.stringify({email,redirect_to:redirectTo||location.href})});
    },
    async updateUser(values){
      if(!session?.access_token)return {data:null,error:{message:'Password reset session has expired. Request a new reset email.'}};
      const r=await req(AUTH,'/user',{method:'PUT',body:JSON.stringify(values)});
      if(r.data?.user)session.user=r.data.user;
      save(); return r;
    },
    onAuthStateChange(fn){listeners.push(fn); return {data:{subscription:{unsubscribe(){const i=listeners.indexOf(fn);if(i>=0)listeners.splice(i,1)}}}}}
  };
  async function rpc(name,args={}){return req(API,'/rpc/'+encodeURIComponent(name),{method:'POST',body:JSON.stringify(args)})}
  function from(table){
    const state={select:'*',filters:[],order:null,limit:null};
    const builder={
      select(cols='*'){state.select=cols;return builder},
      eq(col,val){state.filters.push([col,val]);return builder},
      order(col,{ascending=true}={}){state.order=[col,ascending];return builder},
      limit(n){state.limit=n;return builder},
      then(resolve,reject){
        let q='?select='+encodeURIComponent(state.select);
        for(const [c,v] of state.filters)q+='&'+encodeURIComponent(c)+'=eq.'+encodeURIComponent(String(v));
        if(state.order)q+='&order='+encodeURIComponent(state.order[0])+'.'+(state.order[1]?'asc':'desc');
        if(state.limit!=null)q+='&limit='+state.limit;
        return req(API,'/'+encodeURIComponent(table)+q).then(resolve,reject);
      }
    };return builder;
  }
  function setSession(s){session=s;save();}
  return {auth,rpc,from,__setSession:setSession};
}

async function creatorLogin(e){e.preventDefault();const er=document.getElementById('loginError');er.textContent='';const email=document.getElementById('email').value.trim().toLowerCase();if(email!=='hasbee1110@gmail.com'){er.textContent='Creator access denied.';return}const{data,error}=await supabase.auth.signInWithPassword({email,password:document.getElementById('password').value});if(error){er.textContent=error.message;return}const{data:stats,error:ce}=await supabase.rpc('creator_stats');if(ce||!stats?.[0]){await supabase.auth.signOut();er.textContent=ce?.message||'This account is not authorized for the Creator Portal.';return}creatorUser=data.user;dashboard()}
async function creatorReset(){const er=document.getElementById('loginError');const email=(document.getElementById('email')?.value||'').trim().toLowerCase();if(email!=='hasbee1110@gmail.com'){er.textContent='Creator access denied.';return}er.textContent='Sending password reset email…';const redirectTo=new URL('/creator/',location.href).href;const{error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});if(error){er.textContent='Reset email could not be sent: '+error.message;return}er.textContent='Reset request accepted. Check Inbox, Spam, Promotions and Updates for the Creator email.'}
function logout(){supabase.auth.signOut();creatorUser=null;login()}
async function dashboard(){try{const[st,sch,pl,req]=await Promise.all([supabase.rpc('creator_stats'),supabase.rpc('creator_dashboard'),supabase.from('subscription_plans').select('id,name,price,billing_period,description,features,active').order('price'),supabase.rpc('creator_subscription_requests_v2')]);if(st.error||sch.error){await supabase.auth.signOut();login();document.getElementById('loginError').textContent=st.error?.message||sch.error?.message||'Creator dashboard access failed.';return}plans=pl.data||[];schools=sch.data||[];requests=req.data||[];const x=st.data?.[0]||{};const activePlans=plans.filter(p=>p.active);app.innerHTML=`<main class="main"><div class="head"><div><div class="ey">PRIVATE PLATFORM OWNER</div><h1>Creator Dashboard</h1><p class="muted">Manage schools, subscriptions, pricing, features and platform announcements.</p></div><div class="actions"><button class="primary" onclick="subscriptionManager()">Subscription Management</button><button class="outline" onclick="announcementBox()">Send Announcement</button><button class="outline" onclick="dashboard()">Refresh</button><button class="primary" onclick="logout()">Sign out</button></div></div><div class="grid"><div class="card stat"><b>${x.total_schools||0}</b><small>Total Schools</small></div><div class="card stat"><b>${x.total_students||0}</b><small>Total Students</small></div><div class="card stat"><b>${x.active_subscriptions||0}</b><small>Active Subscriptions</small></div><div class="card stat"><b>${x.expiring_soon||0}</b><small>Expiring Within 7 Days</small></div></div><section class="panel subscription-center"><div class="subscription-center-head"><div><div class="ey">SUBSCRIPTION CENTER</div><h2>Plans, Pricing & Features</h2><p class="muted">Create plans, change prices, add features and control which plans schools can request.</p></div><button class="primary" onclick="subscriptionManager()">Open Subscription Management →</button></div><div class="plan-preview-grid">${activePlans.map(p=>`<div class="plan-preview ${p.billing_period==='annual'?'featured':''}"><div class="ey">${esc(p.billing_period||'PLAN')}</div><h3>${esc(p.name)}</h3><div class="bigprice">₦${Number(p.price||0).toLocaleString()}</div><small class="muted">${p.billing_period==='annual'?'per year':p.billing_period==='monthly'?'per month':'trial'}</small><div class="plan-feature-list">${(Array.isArray(p.features)?p.features:[]).slice(0,5).map(f=>`<span class="feature-chip">${esc(f)}</span>`).join('')}</div></div>`).join('')||'<p class="muted">No active plans.</p>'}</div></section><section class="panel"><div class="section-title"><div><h2>Schools</h2><p class="muted">Every school with its current student total and subscription status.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>School</th><th>Students</th><th>Subscription</th><th>Expires</th><th>Action</th></tr></thead><tbody>${schools.map(s=>{const exp=s.expires_at?new Date(s.expires_at):null;const soon=exp&&exp>new Date()&&exp<=new Date(Date.now()+7*864e5);const st=s.account_status==='suspended'?'expired':s.account_status==='removed'?'expired':s.subscription_status==='active'?'active':s.subscription_status==='expired'?'expired':'';return `<tr><td><b>${esc(s.school_name)}</b><small>${esc(s.school_email||'')}</small></td><td><b>${s.student_count||0}</b></td><td><span class="pill ${soon?'soon':st}">${esc(s.account_status||'active')} · ${esc(s.plan_name||'Not started')} · ${esc(s.subscription_status||'')}</span></td><td>${exp?exp.toLocaleString():'—'}</td><td><div class="actions"><button class="outline" onclick="openApprove('${s.school_id}')">Manage Subscription</button><button class="outline" onclick="manageSchoolStatus('${s.school_id}','${s.account_status||'active'}')">Account</button></div></td></tr>`}).join('')||'<tr><td colspan="5">No schools yet.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="section-title"><div><h2>Subscription Requests</h2><p class="muted">Professional request records with complete school, management, pricing and time details.</p></div><button class="outline" onclick="subscriptionManager()">Manage Plans</button></div>${requests.map(r=>`<article class="request-card ${esc(r.status)}"><div class="request-head"><div><div class="ey">${esc((r.contact_method||'REQUEST').toUpperCase())}</div><h3>${esc(r.school_name)}</h3><p class="muted">${esc(r.plan_name)} · ₦${Number(r.price||0).toLocaleString()} · ${esc(r.billing_period||'')} · ${new Date(r.created_at).toLocaleString()}</p></div><span class="pill ${r.status==='pending'?'soon':r.status==='approved'?'active':'expired'}">${esc(r.status)}</span></div><div class="request-meta"><div class="meta"><small>Management</small><b>${esc(r.management_name||'—')}</b></div><div class="meta"><small>Username</small><b>${esc(r.management_username||'—')}</b></div><div class="meta"><small>School Email</small><b>${esc(r.school_email||'—')}</b></div><div class="meta"><small>School Phone</small><b>${esc(r.school_phone||'—')}</b></div><div class="meta"><small>Date Requested</small><b>${new Date(r.created_at).toLocaleDateString()}</b></div><div class="meta"><small>Time Requested</small><b>${new Date(r.created_at).toLocaleTimeString()}</b></div></div><div class="request-detail"><b>School address:</b> ${esc(r.school_address||'Not provided')}<br><b>Request ID:</b> ${esc(r.request_id)}<br><b>Contact method:</b> ${esc((r.contact_method||'').toUpperCase())}</div>${r.status==='pending'?`<div class="request-actions"><button class="primary" onclick="openApproveRequest('${r.request_id}','${r.plan_id}')">Accept & Activate</button><button class="outline" onclick="rejectRequest('${r.request_id}')">Reject Request</button><button class="outline" onclick="copyRequestDetails('${r.request_id}')">Copy Details</button></div>`:`<div class="request-actions"><button class="outline" onclick="copyRequestDetails('${r.request_id}')">Copy Details</button></div>`}</article>`).join('')||'<p class="muted">No subscription requests yet.</p>'}</section><section class="panel"><div class="section-title"><div><h2>Platform Announcements</h2><p class="muted">Messages sent from Creator to School Management.</p></div></div><div id="announcements">Loading…</div></section></main>`;loadAnnouncements()}catch(err){await supabase.auth.signOut();login();document.getElementById('loginError').textContent=err.message||'Creator dashboard failed to load.'}}

async function savePlan(id){const name=document.getElementById('pn-'+id)?.value.trim();const price=Number(document.getElementById('pp-'+id)?.value);const period=document.getElementById('pb-'+id)?.value;const description=document.getElementById('pd-'+id)?.value.trim();const features=(document.getElementById('pf-'+id)?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);const active=document.getElementById('pa-'+id)?.checked??true;if(!name){alert('Plan name is required.');return}if(!Number.isFinite(price)||price<0){alert('Enter a valid amount.');return}const{error}=await supabase.rpc('creator_update_subscription_plan',{p_plan_id:id,p_name:name,p_price:price,p_billing_period:period,p_description:description,p_features:features,p_active:active});if(error){alert(error.message);return}alert('Subscription plan updated successfully.');subscriptionManager()}

async function addPlan(){const name=document.getElementById('newPlanName')?.value.trim();const price=Number(document.getElementById('newPlanPrice')?.value);const period=document.getElementById('newPlanPeriod')?.value;const description=document.getElementById('newPlanDescription')?.value.trim();const features=(document.getElementById('newPlanFeatures')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!name){alert('Enter a plan name.');return}if(!Number.isFinite(price)||price<0){alert('Enter a valid amount.');return}const{error}=await supabase.rpc('creator_add_subscription_plan',{p_name:name,p_price:price,p_billing_period:period,p_description:description,p_features:features});if(error){alert(error.message);return}alert('New subscription plan added.');subscriptionManager()}

async function subscriptionManager(){try{const{data,error}=await supabase.from('subscription_plans').select('id,name,price,billing_period,description,features,active').order('price');if(error)throw error;plans=data||[];const active=plans.filter(p=>p.active);app.innerHTML=`<main class="main"><div class="head"><div><div class="ey">PRIVATE PLATFORM OWNER</div><h1>Subscription Management</h1><p class="muted">Your subscription control center — pricing, billing periods, features and new plans.</p></div><div class="actions"><button class="outline" onclick="dashboard()">← Dashboard</button><button class="primary" onclick="logout()">Sign out</button></div></div><section class="panel subscription-center"><div class="subscription-center-head"><div><div class="ey">CUSTOMIZE YOUR PLANS</div><h2>Active Plan Preview</h2><p class="muted">This is how active plans are presented to School Management.</p></div><div class="admin-note"><b>Current standard:</b> Monthly ₦10,000 · 3-month term ₦30,000 · Yearly ₦80,000</div></div><div class="plan-preview-grid">${active.map(p=>`<div class="plan-preview ${p.billing_period==='annual'?'featured':''}"><div class="ey">${esc(p.billing_period||'PLAN')}</div><h3>${esc(p.name)}</h3><div class="bigprice">₦${Number(p.price||0).toLocaleString()}</div><small class="muted">${p.billing_period==='annual'?'per year':p.billing_period==='monthly'?'per month':'trial'}</small><p class="muted">${esc(p.description||'')}</p><div class="plan-feature-list">${(Array.isArray(p.features)?p.features:[]).map(f=>`<span class="feature-chip">${esc(f)}</span>`).join('')||'<span class="muted">No features yet.</span>'}</div></div>`).join('')||'<p class="muted">No active plans.</p>'}</div></section><section class="panel"><div class="section-title"><div><h2>Edit Existing Plans</h2><p class="muted">One feature per line. Turn a plan off instead of deleting it, so old subscription history remains safe.</p></div></div><div class="plan-admin-grid">${plans.map(p=>`<div class="plan-admin-card"><div class="ey">${esc(p.billing_period||'PLAN')}</div><h3>${esc(p.name)}</h3><div class="price-preview">₦${Number(p.price||0).toLocaleString()}</div><label class="field"><span>Plan name</span><input id="pn-${p.id}" value="${esc(p.name)}"></label><label class="field"><span>Amount (NGN)</span><input id="pp-${p.id}" type="number" min="0" step="100" value="${Number(p.price||0)}"></label><label class="field"><span>Billing period</span><select id="pb-${p.id}"><option value="trial" ${p.billing_period==='trial'?'selected':''}>Trial</option><option value="monthly" ${p.billing_period==='monthly'?'selected':''}>Monthly</option><option value="annual" ${p.billing_period==='annual'?'selected':''}>Yearly</option></select></label><label class="field"><span>Description</span><textarea id="pd-${p.id}" rows="3">${esc(p.description||'')}</textarea></label><label class="field"><span>Features — one per line</span><textarea class="feature-editor" id="pf-${p.id}" rows="6">${esc((Array.isArray(p.features)?p.features:[]).join('\n'))}</textarea></label><label class="check"><input id="pa-${p.id}" type="checkbox" ${p.active?'checked':''}> Active and visible to schools</label><div class="plan-actions"><button class="primary" onclick="savePlan('${p.id}')">Save Plan</button></div></div>`).join('')}</div></section><section class="panel add-plan-box"><div class="ey">ADD SOMETHING NEW</div><h2>Add New Subscription Plan</h2><p class="muted">Create another package whenever you want — for example Basic, Premium or Enterprise.</p><form class="form" onsubmit="event.preventDefault();addPlan()"><div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field"><span>Plan name</span><input id="newPlanName" placeholder="Premium"></label><label class="field"><span>Amount (NGN)</span><input id="newPlanPrice" type="number" min="0" step="100" placeholder="15000"></label></div><div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field"><span>Billing period</span><select id="newPlanPeriod"><option value="monthly">Monthly</option><option value="annual">Yearly</option><option value="trial">Trial</option></select></label><label class="field"><span>Description</span><input id="newPlanDescription" placeholder="For schools that need more features"></label></div><label class="field"><span>Features — one per line</span><textarea id="newPlanFeatures" class="feature-editor" rows="7" placeholder="Advanced analytics\nParent portal\nSMS notifications\nCustom branding"></textarea></label><button class="primary">＋ Add New Plan</button></form></section><section class="panel"><div class="brand-message"><b>WhatsApp request design</b><br>School requests now use a branded, structured message with the eResults header, school details, management details, requested plan, amount, billing period, current subscription, request ID and exact date/time. The WhatsApp link can format text, but it cannot automatically attach an image/logo; the actual eResults logo remains on the portal and can be attached in WhatsApp if needed.</div></section></main>`}catch(err){alert(err.message||'Subscription management could not load.');dashboard()}}
function copyRequestDetails(id){const r=requests.find(x=>x.request_id===id);if(!r)return;const text=['eRESULTS SUBSCRIPTION REQUEST','School: '+r.school_name,'School Email: '+(r.school_email||'—'),'School Phone: '+(r.school_phone||'—'),'Address: '+(r.school_address||'—'),'Management: '+(r.management_name||'—'),'Username: '+(r.management_username||'—'),'Plan: '+r.plan_name,'Amount: ₦'+Number(r.price||0).toLocaleString(),'Billing: '+r.billing_period,'Contact: '+r.contact_method,'Date: '+new Date(r.created_at).toLocaleDateString(),'Time: '+new Date(r.created_at).toLocaleTimeString(),'Request ID: '+r.request_id].join('\n');navigator.clipboard?.writeText(text).then(()=>alert('Request details copied.')).catch(()=>prompt('Copy request details:',text))}
async function loadAnnouncements(){const box=document.getElementById('announcements');if(!box)return;const{data,error}=await supabase.from('platform_announcements').select('title,body,created_at').eq('active',true).order('created_at',{ascending:false}).limit(20);box.innerHTML=error?`<p class="error">Could not load announcements: ${esc(error.message)}</p>`:(data||[]).map(a=>`<div class="notice"><b>${esc(a.title)}</b><span>${esc(a.body)}</span><small>${new Date(a.created_at).toLocaleString()}</small></div>`).join('')||'<p class="muted">No announcements yet.</p>'}
function announcementBox(){const title=prompt('Announcement title:');if(!title)return;const body=prompt('Announcement message:');if(!body)return;sendAnnouncement(title,body)}
async function sendAnnouncement(title,body){const{error}=await supabase.rpc('creator_send_announcement',{p_title:title,p_body:body});if(error){alert(error.message);return}alert('Announcement sent to School Management.');dashboard()}
function openApprove(schoolId,requestedPlanId){pendingSchool=schoolId;pendingRequestId=null;document.getElementById('modalTitle').textContent='Activate subscription';document.getElementById('approvePlan').innerHTML=plans.map(p=>`<option value="${p.id}" ${requestedPlanId===p.id?'selected':''}>${esc(p.name)} — ₦${Number(p.price||0).toLocaleString()}</option>`).join('');syncApprovePlan();document.getElementById('modalError').textContent='';document.getElementById('modal').classList.add('show')}
function openApproveRequest(requestId,requestedPlanId){pendingRequestId=requestId;pendingSchool=null;document.getElementById('modalTitle').textContent='Accept subscription request';document.getElementById('approvePlan').innerHTML=plans.map(p=>`<option value="${p.id}" ${requestedPlanId===p.id?'selected':''}>${esc(p.name)} — ₦${Number(p.price||0).toLocaleString()}</option>`).join('');syncApprovePlan();document.getElementById('modalError').textContent='';document.getElementById('modal').classList.add('show')}
function syncApprovePlan(){const id=document.getElementById('approvePlan')?.value;const p=plans.find(x=>x.id===id);if(!p)return;const period=String(p.billing_period||'').toLowerCase();const days=period==='annual'?365:period==='monthly'?30:period==='trial'?15:30;document.getElementById('approveDays').value=days;document.getElementById('approvePlanInfo').innerHTML='<b>'+esc(p.name)+'</b> · ₦'+Number(p.price||0).toLocaleString()+' · '+esc(period==='annual'?'12 months':period==='monthly'?'1 month':period==='trial'?'15-day trial':'Custom period')}
function closeModal(){document.getElementById('modal').classList.remove('show');pendingSchool=null;pendingRequestId=null}
async function approveSubscription(e){e.preventDefault();const er=document.getElementById('modalError');er.textContent='';const days=Number(document.getElementById('approveDays').value);if(days<1){er.textContent='Activation duration must be at least 1 day.';return}if(pendingRequestId){const{error}=await supabase.rpc('creator_review_subscription_request',{p_request_id:pendingRequestId,p_action:'approve',p_days:days});if(error){er.textContent=error.message;return}closeModal();alert('Request accepted and subscription activated.');dashboard();return}if(!pendingSchool)return;const{error}=await supabase.rpc('creator_set_subscription',{p_school_id:pendingSchool,p_plan_id:document.getElementById('approvePlan').value,p_days:days});if(error){er.textContent=error.message;return}closeModal();alert('Subscription activated.');dashboard()}
async function rejectRequest(requestId){if(!confirm('Reject this subscription request?'))return;const{error}=await supabase.rpc('creator_review_subscription_request',{p_request_id:requestId,p_action:'reject'});if(error){alert(error.message);return}alert('Subscription request rejected.');dashboard()}
async function manageSchoolStatus(schoolId,current){const action=prompt('Type ACTIVE, SUSPEND, or REMOVE for this school.\n\nSUSPEND = temporarily block access.\nACTIVE = restore access.\nREMOVE = deactivate the school account.');if(action===null)return;const v=action.trim().toLowerCase();const target=v==='suspend'?'suspended':v==='active'?'active':v==='remove'?'removed':null;if(!target){alert('Please type ACTIVE, SUSPEND, or REMOVE.');return}if(target==='removed'&&!confirm('Remove this school account from active use? Its records will be preserved, but school access will be blocked.'))return;const{error}=await supabase.rpc('creator_set_school_status',{p_school_id:schoolId,p_status:target});if(error){alert(error.message);return}alert(target==='active'?'School activated.':target==='suspended'?'School suspended.':'School removed from active use.');dashboard()}

async function finishReset(e){e.preventDefault();const er=document.getElementById('loginError');const a=document.getElementById('np').value,b=document.getElementById('np2').value;if(a!==b){er.textContent='Passwords do not match.';return}if(a.length<6){er.textContent='Password must be at least 6 characters.';return}er.textContent='Updating password…';const{error}=await supabase.auth.updateUser({password:a});if(error){er.textContent=error.message;return}await supabase.auth.signOut();recoveryMode=false;history.replaceState({},'',new URL('/creator/',location.href).href);app.innerHTML=`<section class="card login"><div class="ey">PASSWORD UPDATED</div><h1>Password changed successfully</h1><p class="muted">Your Creator Portal password has been updated. Sign in with your new password.</p><button class="primary full" onclick="login()">Return to Creator Login</button></section>`}
function showRecovery(){recoveryMode=true;app.innerHTML=`<section class="card login"><div class="ey">SECURE CREATOR RESET</div><h1>Set a new password</h1><p class="muted">Create a new password for the authorized Creator account.</p><form class="form" onsubmit="finishReset(event)"><label class="field"><span>New password</span><input id="np" type="password" minlength="6" autocomplete="new-password" required></label><label class="field"><span>Confirm password</span><input id="np2" type="password" minlength="6" autocomplete="new-password" required></label><button class="primary full">Update Password</button><div id="loginError" class="error"></div></form></section>`}
async function boot(){try{const hash=new URLSearchParams(location.hash.replace(/^#/,'&'));const type=hash.get('type');if(type==='recovery' && hash.get('access_token')){const token=hash.get('access_token'),refresh=hash.get('refresh_token');let user=null;try{const r=await fetch(SB_URL+'/auth/v1/user',{headers:{apikey:SB_KEY,Authorization:'Bearer '+token}});if(r.ok)user=await r.json()}catch{};if(user){localStorage.setItem('eresults_creator_session',JSON.stringify({access_token:token,refresh_token:refresh,user}));supabase.__setSession?.({access_token:token,refresh_token:refresh,user});showRecovery();return}}const{data}=await supabase.auth.getSession();if(data.session){const email=(data.session.user.email||'').toLowerCase();if(email==='hasbee1110@gmail.com'){const{data:s,error}=await supabase.rpc('creator_stats');if(!error&&s?.[0]){creatorUser=data.session.user;await dashboard();return}}await supabase.auth.signOut()}login()}catch(err){showFatal(err.message||'The Creator Portal could not start.')}}
boot();
</script></body></html>
